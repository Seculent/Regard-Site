name: Production Monitor

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-check:
    name: Check production availability
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check public endpoints
        shell: bash
        run: |
          set -euo pipefail

          check_200() {
            local url="$1"

            echo "Checking: $url"

            status="$(
              curl \
                --silent \
                --show-error \
                --location \
                --retry 2 \
                --retry-delay 2 \
                --connect-timeout 10 \
                --max-time 20 \
                --output /dev/null \
                --write-out "%{http_code}" \
                "$url"
            )"

            echo "HTTP $status"

            if [[ "$status" != "200" ]]; then
              echo "::error::Expected HTTP 200 from $url, got HTTP $status"
              exit 1
            fi
          }

          check_200 "https://www.regard-spb.ru/"
          check_200 "https://www.regard-spb.ru/admin/"
          check_200 "https://www.regard-spb.ru/content/projects.json"
          check_200 "https://www.regard-spb.ru/content/news.json"
          check_200 "https://www.regard-spb.ru/robots.txt"
          check_200 "https://www.regard-spb.ru/sitemap.xml"

      - name: Check 404 behaviour
        shell: bash
        run: |
          set -euo pipefail

          url="https://www.regard-spb.ru/__regard_production_monitor_missing_page__"

          echo "Checking: $url"

          status="$(
            curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 20 \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$url"
          )"

          echo "HTTP $status"

          if [[ "$status" != "404" ]]; then
            echo "::error::Expected HTTP 404 from missing URL, got HTTP $status"
            exit 1
          fi

      - name: Check browser-rendered content
        shell: bash
        run: |
          set -euo pipefail

          browser="$(
            command -v google-chrome ||
            command -v chromium ||
            command -v chromium-browser ||
            true
          )"

          if [[ -z "$browser" ]]; then
            echo "::error::No supported Chrome/Chromium browser found on runner"
            exit 1
          fi

          dom="$(mktemp)"
          log="$(mktemp)"

          cleanup() {
            rm -f "$dom" "$log"
          }

          trap cleanup EXIT

          url="https://www.regard-spb.ru/?__regard_browser_smoke=$(date +%s)"

          echo "Browser: $browser"
          echo "Checking: $url"

          if ! timeout 30s "$browser" \
            --headless=new \
            --disable-gpu \
            --disable-dev-shm-usage \
            --no-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --window-size=1440,1200 \
            --virtual-time-budget=10000 \
            '--host-resolver-rules=MAP static.cloudflareinsights.com 127.0.0.1' \
            --dump-dom \
            "$url" \
            >"$dom" \
            2>"$log"
          then
            echo "::error::Headless browser failed to render production homepage"
            tail -n 100 "$log" || true
            exit 1
          fi

          if [[ ! -s "$dom" ]]; then
            echo "::error::Headless browser returned an empty DOM"
            exit 1
          fi

          project_count="$(
            (grep -o 'data-project-id=' "$dom" || true) |
            wc -l |
            tr -d ' '
          )"

          news_count="$(
            (grep -o 'news-card h-100' "$dom" || true) |
            wc -l |
            tr -d ' '
          )"

          echo "Rendered project entries: $project_count"
          echo "Rendered news cards: $news_count"

          if (( project_count < 1 )); then
            echo "::error::Project carousel did not render production content"
            exit 1
          fi

          if (( news_count < 1 )); then
            echo "::error::News section did not render production content"
            exit 1
          fi

          echo "Browser-rendered production content OK"
