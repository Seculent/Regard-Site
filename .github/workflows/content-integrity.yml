name: Site Integrity

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "admin/**"
      - "content/**"
      - "css/**"
      - "javascript/**"
      - "JPG/**"
      - "PDF/**"
      - "favicon_io/**"
      - "scripts/**"
      - "robots.txt"
      - "sitemap.xml"
      - "CNAME"
      - ".github/workflows/content-integrity.yml"

  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "admin/**"
      - "content/**"
      - "css/**"
      - "javascript/**"
      - "JPG/**"
      - "PDF/**"
      - "favicon_io/**"
      - "scripts/**"
      - "robots.txt"
      - "sitemap.xml"
      - "CNAME"
      - ".github/workflows/content-integrity.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-check:
    name: Validate site release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(
            find javascript scripts \
              -type f \
              \( -name "*.js" -o -name "*.mjs" \) \
              -print0 | sort -z
          )

      - name: Validate static site integrity
        run: node scripts/validate-site.mjs

      - name: Validate content integrity
        run: node scripts/check-content.mjs
