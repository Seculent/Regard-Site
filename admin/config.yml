locale: "ru"

backend:
  name: github
  repo: Seculent/Regard-Site
  branch: main

  base_url: https://regard-cms-auth.akhmadeev93.workers.dev
  auth_endpoint: auth

media_folder: "JPG/uploads"
public_folder: "/JPG/uploads"

output:
  omit_empty_optional_fields: true

collections:
  - label: "Объекты"
    name: "projects_data"
    files:
      - label: "Все объекты"
        name: "projects"
        file: "content/projects.json"
        format: "json"
        fields:
          - label: "Объекты"
            name: "items"
            widget: "list"
            root: true
            add_to_top: false
            collapsed: true
            summary: "{{fields.title}} — {{fields.id}}"
            label_singular: "объект"
            fields:
              - { label: "ID", name: "id", widget: "string", pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Используйте только строчные латинские буквы, цифры и дефисы. Например: novoe-kolpino'], hint: "Технический идентификатор объекта. После публикации НЕ МЕНЯТЬ. Для нового объекта используйте строчные латинские буквы, цифры и дефисы, например: novoe-kolpino." }
              - { label: "Название", name: "title", widget: "string" }
              - { label: "Опубликован на сайте", name: "published", widget: "boolean", default: true, hint: "Главный переключатель объекта. Если выключить, объект будет полностью скрыт на сайте — и в карусели, и на карте." }
              - { label: "Показывать в карусели объектов", name: "showInCarousel", widget: "boolean", default: true, hint: "Показывает объект в карусели на сайте. Работает только если включено «Опубликован на сайте»." }
              - { label: "Показывать на карте", name: "showOnMap", widget: "boolean", default: true, hint: "Показывает объект на карте. Работает только если объект опубликован и указаны координаты." }
              - { label: "Обложка", name: "preview", widget: "image", choose_url: false }
              - { label: "Описание", name: "description", widget: "richtext", modes: ["rich_text"], buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list", "quote"], editor_components: [], hint: "Описание объекта в визуальном редакторе. Можно использовать жирный и курсивный текст, ссылки и списки." }
              - label: "Галерея"
                name: "images"
                widget: "list"
                label_singular: "фотографию"
                field: { label: "Фото", name: "image", widget: "image", choose_url: false }
              - label: "Карта"
                name: "map"
                widget: "object"
                fields:
                  - label: "Координаты"
                    name: "coords"
                    widget: "list"
                    min: 2
                    max: 2
                    hint: "Сначала широта, затем долгота."
                    field: { label: "Координата", name: "coordinate", widget: "number", value_type: "float" }
                  - { label: "Адрес", name: "address", widget: "string" }
                  - { label: "Название в списке карты", name: "listTitle", widget: "string", required: false }
                  - { label: "Цвет метки", name: "markerColor", widget: "color", required: false, default: "#5c5b5b" }

  - label: "Новости"
    name: "news_data"
    files:
      - label: "Все новости"
        name: "news"
        file: "content/news.json"
        format: "json"
        fields:
          - label: "Новости"
            name: "items"
            widget: "list"
            root: true
            add_to_top: true
            collapsed: true
            summary: "{{fields.date}} — {{fields.title}}"
            label_singular: "новость"
            fields:
              - { label: "ID", name: "id", widget: "number", value_type: "int", min: 1, hint: "Технический номер новости. Должен быть уникальным. У существующей новости НЕ МЕНЯТЬ. Для новой новости укажите новый номер, который ещё не используется." }
              - { label: "Дата", name: "date", widget: "string", hint: "Формат: ДД.ММ.ГГГГ" }
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Краткий текст", name: "excerpt", widget: "text" }
              - { label: "Полный текст", name: "fullText", widget: "richtext", modes: ["rich_text"], buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list", "quote"], editor_components: [], hint: "Основной текст новости. Можно использовать жирный и курсивный текст, ссылки и списки." }
              - { label: "Опубликована на сайте", name: "published", widget: "boolean", default: true, hint: "Если выключить, новость останется в CMS, но перестанет отображаться на сайте." }



